name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Poppler for PDF asset validation
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --yes poppler-utils
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install poppler
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check src tests
        if: runner.os == 'Linux'
      - run: uv run ruff format --check src tests
        if: runner.os == 'Linux'
      - run: uv run mypy src
        if: runner.os == 'Linux'
      - run: uv run pytest
      - run: uv build
        if: runner.os == 'Linux'

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Verify package and timezone data
        run: |
          uv run woon version
          uv run python -c "from zoneinfo import ZoneInfo; assert ZoneInfo('Asia/Seoul').key == 'Asia/Seoul'"
      - run: uv build
