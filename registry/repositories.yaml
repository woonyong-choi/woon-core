version: 1
repositories:
  core:
    remote: https://github.com/woonyong-choi/woon-core.git
    directory: woon-core
    role: control-plane
  skills:
    remote: https://github.com/woonyong-choi/woon-skills.git
    directory: woon-skills
    role: skill-catalog
  env:
    remote: https://github.com/woonyong-choi/woon-env.git
    directory: woon-env
    role: environment
  knowledge:
    remote: https://github.com/woonyong-choi/woon-knowledge.git
    directory: woon-knowledge
    role: knowledge
  obsidian-theme:
    context_managed: false
    local_only: true
    directory: woon-obsidian-theme
    role: obsidian-theme-source
  link-calendar:
    context_managed: false
    remote: https://github.com/woonyong-choi/manta-calendar.git
    base: workspace-parent
    directory: OSS/obsidian/manta-calendar
    role: obsidian-plugin-source
  linked-graph:
    context_managed: false
    remote: https://github.com/woonyong-choi/manta-graph.git
    base: workspace-parent
    directory: OSS/obsidian/manta-graph
    role: obsidian-plugin-source
  runnable-code:
    context_managed: false
    remote: https://github.com/woonyong-choi/manta-code-blocks.git
    base: workspace-parent
    directory: OSS/obsidian/manta-code-blocks
    role: obsidian-plugin-source
  woon-merge:
    context_managed: false
    remote: https://github.com/woonyong-choi/manta.git
    base: workspace-parent
    directory: OSS/obsidian/woon-merge
    role: obsidian-plugin-source
  manta:
    context_managed: false
    local_only: true
    base: workspace-parent
    directory: OSS/obsidian/manta
    role: obsidian-plugin-source
  profile-output:
    remote: https://github.com/woonyong-choi/woonyong-choi.git
    directory: woonyong-kr
    role: generated-profile
    output: true
  pages-output:
    remote: https://github.com/woonyong-choi/woonyong-kr.github.io.git
    directory: woonyong-kr.github.io
    role: generated-pages
    output: true
