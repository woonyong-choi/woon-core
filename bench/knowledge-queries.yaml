# Retrieval benchmark query set for `woon knowledge bench`.
#
# Each query is phrased the way the question would actually be asked and is drawn
# from a real Wiki page's body rather than its title, so a hit has to come from
# the indexed prose instead of a title keyword match. Every query has exactly one
# correct answer; `expected` is the page path relative to the Wiki root. Topics
# whose vocabulary a sibling page shares (patch embedding vs. the Vision
# Transformer overview, SVD/PCA vs. matrix decomposition) are left out on purpose.
version: 1
queries:
  - query: 동전을 세 번 던져 모두 앞면일 때 사전분포로 극단적인 추정을 완화하는 방법
    expected: ai/map-estimation.md
  - query: 여러 Query head를 그룹으로 묶어 하나의 K/V head를 공유하면 decode 메모리가 어떻게 되나
    expected: ai/grouped-query-attention.md
  - query: 별도 draft 모델 없이 몇 스텝 뒤의 토큰 후보를 예측하는 보조 head를 붙이는 방법
    expected: ai/medusa-heads.md
  - query: 커널 원소 사이에 빈칸을 두어 파라미터를 늘리지 않고 넓은 문맥을 보는 합성곱
    expected: ai/dilated-convolution.md
  - query: depth와 width와 resolution을 균형 있게 조절하는 compound scaling
    expected: ai/efficientnet-scaling.md
  - query: 스마트폰과 임베디드에서 정확도를 조금 양보하고 계산량과 파라미터를 줄이는 CNN
    expected: ai/mobilenet-lightweight.md
  - query: 손글씨 숫자 분류와 대규모 RGB 이미지 분류 모델의 공통 골격과 차이
    expected: ai/lenet-alexnet.md
  - query: 토큰마다 일부 전문가만 활성화해 추론 비용을 낮춘 sparse MoE 오픈 가중치 모델
    expected: ai/mistral-mixtral.md
  - query: 행렬을 곱해도 방향이 유지되고 크기만 달라지는 벡터를 찾는 이유
    expected: ai/eigenvalue-eigenvector.md
  - query: 모델이 실패할 입력을 의도적으로 던져 위험 답변과 정책 우회를 찾는 안전성 평가
    expected: ai/red-teaming.md
  - query: 외부 시스템 기능을 Tool과 Resource와 Prompt로 감싸 Host가 발견하고 호출하게 만들기
    expected: ai/mcp-server-implementation.md
  - query: 먼저 끝난 요청의 자리를 다음 요청으로 채울지 정하는 batch 교체 시점
    expected: ai/static-dynamic-batching.md
  - query: 요청 수만 보고 스케일하면 빗나가는 LLM 서빙 인스턴스 조절과 요청 분배
    expected: ai/autoscaling-load-balancing.md
  - query: 필요한 문서를 찾았는지와 그 문서에 근거해 답했는지를 나눠 보는 기준
    expected: ai/rag-evaluation-metrics.md
  - query: 사실과 규칙을 기호로 표현해 왜 이 결론이 나왔는지 경로로 설명하는 접근
    expected: ai/symbolic-ai-reasoning.md
  - query: BIO 표기로 원문 span과 model token 경계를 일치시키는 방법
    expected: ai/named-entity-recognition.md
  - query: 천 건의 고품질 지시 답변 쌍이 오만 건의 저품질 데이터보다 나은 이유
    expected: ai/sft-data-quality.md
  - query: 루트 계정을 공유하지 않고 개발자와 배포 스크립트마다 권한을 구분하기
    expected: security/aws-iam.md
  - query: 배열 정렬이나 픽셀 계산이 메인 스레드를 점유해 클릭과 스크롤이 멈출 때
    expected: backend/web-workers.md
  - query: 매 스텝의 최선이 전체 문장의 최선으로 이어지지 않을 때 후보를 여러 개 유지하기
    expected: ai/beam-search-decoding.md
