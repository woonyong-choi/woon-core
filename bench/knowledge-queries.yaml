# Retrieval benchmark query set for `woon knowledge bench`.
#
# Rules this set follows, so that a run can detect a regression instead of
# reporting a saturated 1.00:
#
# 1. Every query is phrased in the words a person would actually use, not the
#    words the answer page uses in its title. Several are written with synonyms
#    or an everyday paraphrase of the page's own vocabulary, and a few are asked
#    in English against a Korean page.
# 2. Many queries sit inside a cluster whose pages share most of their
#    vocabulary (kv-cache-*, chunking-*, *-rag, lstm/gru, mcp-*), so a ranking
#    change moves the answer against a close competitor rather than against
#    unrelated pages.
# 3. About a quarter of the set is expected to miss the top 5 with the current
#    lexical index. Those are not mislabelled: `evidence` names the section that
#    answers the query, so the label can be rechecked against the page. They are
#    the headroom a semantic or hybrid retriever would have to win back.
#
# `evidence` is required. It records which section of `expected` answers the
# query, in one line.
version: 1
queries:
  # --- 한영 혼용: 한국어 문서를 영어로 묻는다 ---
  - query: KV cache memory footprint per request in bytes when batch is 16
    expected: ai/kv-cache-memory-calculation.md
    evidence: '## 설정별 메모리 추산 — 한 요청 32KB, 배치 16개 기준의 바이트 계산'
  - query: why a decoder must hide future positions with a triangular mask while training
    expected: ai/causal-mask.md
    evidence: '## 미래 위치와 상삼각 영역 — score 행렬에서 j > i 영역을 가리는 이유'
  - query: cosine similarity over dense vectors instead of exact keyword match
    expected: ai/embedding-vector-search.md
    evidence: '## 단어 일치와 벡터 유사도 — 키워드 검색과 임베딩 검색의 차이'

  # --- 제목과 다른 어휘로 묻는다 ---
  - query: 조각을 키우면 잡음이 섞이고 줄이면 문장이 끊기는 균형
    expected: ai/chunking-methods.md
    evidence: '## 작게 자를지, 크게 자를지는 무엇으로 정할까 — chunk_size와 overlap의 맞바꿈'
  - query: router가 질문을 보고 keyword search와 vector search 중 하나를 고르는 구조
    expected: ai/modular-rag.md
    evidence: '## 모듈형 RAG의 흐름 — router가 vector search·SQL lookup 가운데 경로를 고른다'
  - query: 직사각 가중치를 회전과 스케일과 회전으로 나눈 뒤 상위 몇 개만 남겨 근사
    expected: ai/matrix-decomposition-svd-pca.md
    evidence: '## 상위 특이값과 랭크-k 근사 — "회전 → 스케일 → 회전" 분해와 저랭크 근사'
  - query: cell state 없이 hidden state 하나로 update gate와 reset gate만 쓰는 셀
    expected: ai/gru-cell-structure.md
    evidence: '## 은닉 상태의 유지와 갱신 — LSTM의 별도 cell state와 대비한 GRU의 상태 하나'
  - query: query와 key를 위치 각도만큼 돌려 상대 위치가 내적에 남게 하는 방법
    expected: ai/rotary-position-embedding.md
    evidence: '## 위치 정보를 attention score에 넣는 방법 — 회전 후 점곱에 위치 차가 남는다'
  - query: 채점 기준의 허점을 파고들어 점수만 오르고 실제 목적과 어긋나는 현상
    expected: ai/reward-hacking.md
    evidence: '# 보상 해킹 (Reward Hacking) 첫 절 — 평가 기준의 허점까지 학습하는 최적화'
  - query: 더 이상 참조되지 않는 객체를 찾아 메모리를 되돌려 주는 일
    expected: common/garbage-collection.md
    evidence: '## 루트와 도달 가능성 — 루트에서 도달 불가능한 객체를 회수한다'
  - query: 모델 크기와 학습 토큰 수를 같은 예산 안에서 맞바꿀 때 어느 쪽이 부족하면 손해인가
    expected: ai/chinchilla-optimal.md
    evidence: '## 같은 계산 예산에서 두 선택 비교하기 / ## 균형이 필요한 이유'

  # --- 형제 문서와 경합한다 ---
  - query: prefill에서 캐시를 채우고 decode에서 한 토큰 분량만 덧붙이는 동작
    expected: ai/kv-cache-mechanism.md
    evidence: '## Prefill과 Decode에서 KV 캐시가 동작하는 방식 (경합: prefill-decode-phases)'
  - query: 검색 전에 질의를 고쳐 쓰고 검색 뒤 재정렬을 넣는 개선
    expected: ai/advanced-rag.md
    evidence: '## 나이브 RAG와 고급 RAG의 처리 흐름 — 쿼리 변환 → 하이브리드 검색 → 재랭킹 (경합: naive-rag)'
  - query: forget gate가 과거를 얼마나 지울지 정해 장기 의존성을 지키는 게이팅
    expected: ai/lstm-gru-gating.md
    evidence: '### LSTM의 cell state — forget gate가 버릴 양과 보존할 양을 정한다 (경합: lstm-cell-structure)'
  - query: 학습 없이 보정 데이터 수백 건으로 4비트 가중치를 만드는 사후 기법
    expected: ai/gptq-awq-methods.md
    evidence: '## 출력 오차와 활성화 채널 — calibration 데이터로 남은 가중치를 보정 (경합: qlora)'
  - query: 비밀번호를 넘기지 않고 다른 서비스에 권한만 빌려주는 절차
    expected: security/oauth2.md
    evidence: '# OAuth 2.0 권한 위임 첫 절 — 아이디·비밀번호 대신 범위를 한정한 권한만 넘긴다'
  - query: 끝난 시퀀스 자리를 기다리지 않고 새 요청으로 즉시 채우는 iteration 단위 스케줄링
    expected: ai/continuous-batching.md
    evidence: '## 생성 길이와 빈 슬롯 — 먼저 끝난 요청의 빈자리 (경합: static-dynamic-batching)'
  - query: 다른 출처에서 넘어온 요청에 로그인 상태가 딸려 가지 않게 막는 쿠키 속성
    expected: security/samesite-cookies.md
    evidence: '## 자동 첨부와 CSRF — 다른 사이트에서 시작된 요청에 쿠키를 붙이지 않는다'
  - query: 한 번에 한 가지 일만 하는데도 동시에 처리되는 것처럼 보이는 까닭
    expected: backend/single-thread-concurrency.md
    evidence: '## 한 명의 요리사가 여러 요리를 진행하는 방식 / ## 콜 스택에서 이벤트 루프까지'
  - query: 도구 목록을 먼저 받아 본 뒤 고른 기능을 호출하기까지 오가는 메시지 차례
    expected: ai/mcp-protocol.md
    evidence: '### JSON-RPC 메시지 — initialize에서 tools/call까지의 7단계 표 (경합: mcp-server-implementation)'
  - query: residual path로 gradient가 우회하고 정규화가 스케일을 맞추는 블록
    expected: ai/layer-normalization-residual.md
    evidence: '## 스케일과 우회 경로 (경합: transformer-block, rmsnorm)'
  - query: 다음 토큰 확률의 로그 평균에 지수를 취해 모델이 얼마나 헷갈리는지 재는 수치
    expected: ai/perplexity-metric.md
    evidence: '### 로그 손실의 환산 — cross-entropy에 exp를 적용 / ### 객관식 비유'

  # --- 현행 lexical 검색이 놓치는 구간 (동의어·완전 패러프레이즈) ---
  - query: 겹침을 얼마나 줄지와 몇 개를 가져올지를 함께 정해야 하는 이유
    expected: ai/chunking-retrieval-strategies.md
    evidence: '## 청킹과 검색을 조정하는 값 — chunk size·overlap·top_k를 같이 정한다'
  - query: 무엇을 먼저 써야 할지 모델이 스스로 고르도록 쓸 수 있는 기능 목록을 보여 주는 방법
    expected: ai/tool-selection-routing.md
    evidence: '## 질문에 맞는 도구를 고르는 기준'
  - query: 사람이 점수를 매기는 중간 모형 없이 둘 중 나은 답만 골라 정책을 바로 고치는 길
    expected: ai/dpo-direct-preference.md
    evidence: '## Reward Model과 PPO의 부담 / ### 비교 데이터의 역할'
  - query: 여러 장에 같은 모형을 복제해 두고 각자 다른 묶음을 처리한 뒤 기울기를 모으기
    expected: ai/data-parallelism-ddp.md
    evidence: '## DDP에서 GPU마다 달라지는 입력과 같아지는 gradient'
  - query: 글자 단위도 낱말 단위도 아니고 자주 붙어 나오는 조각을 합쳐 사전을 만드는 방식
    expected: ai/byte-pair-encoding.md
    evidence: '## 바이트 어휘와 OOV / ### 병합 우선순위와 동점 처리'
  - query: 질문에 쓰인 말과 문서에 적힌 말이 달라 못 찾을 때 검색어 후보를 여러 개 만들기
    expected: ai/query-transformation.md
    evidence: '## 맥락 의존과 용어 불일치 / ## 502 오류의 검색어 후보'
  - query: 중간 과정을 말로 풀어쓰게 해서 답의 근거를 드러내는 방법
    expected: ai/chain-of-thought.md
    evidence: '## 중간 판단 단계'
  - query: 겹겹이 중첩되던 콜백을 줄이려 만든 객체와 그 위의 문법 설탕
    expected: backend/js-async-callback-promise.md
    evidence: '### 2세대 프로미스 / ### 3세대 async/await / ### 콜백 중첩'
